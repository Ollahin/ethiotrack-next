name: CI

on:
  pull_request:
  push:
    branches:
      - production-v3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Validate Precache
        run: bun scripts/check-ci.ts precache

      - name: Clean-tree invariant
        run: bun scripts/check-ci.ts clean-tree
